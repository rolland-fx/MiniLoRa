<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MiniLoRa-server{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a class="brand" href="/">MiniLoRa<span>-server</span></a>
    {% if stats %}<div class="stats-chip">{{ stats.readings }} readings ·
      {{ stats.devices }} device(s) · {{ stats.diagnostics }} diag</div>{% endif %}
    <div class="nav-links">
      <a href="/">Dashboard</a>
      <a href="/settings">Settings</a>
      <a href="/config-builder">Config builder</a>
      <a href="/ota">OTA</a>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
